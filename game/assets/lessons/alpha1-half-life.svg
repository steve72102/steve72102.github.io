<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title"><title id="title">四種 alpha1 阻斷劑的代表性消除半衰期</title><rect width="680" height="390" rx="18" fill="#fbfdf8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="28" y="37" font-size="24" fill="#284d43" text-anchor="start">血中藥物濃度減半，需要多久？</text><text x="28" y="65" font-size="17" fill="#284d43" text-anchor="start">消除半衰期的代表值（小時）</text><text x="28" y="121" font-size="18" fill="#284d43" text-anchor="start">Prazosin</text><rect x="235" y="101" width="37.5" height="28" rx="7" fill="#246fbb"/><text x="282.5" y="122" font-size="17" fill="#284d43" text-anchor="start">2–3</text><text x="28" y="175" font-size="18" fill="#284d43" text-anchor="start">Alfuzosin 緩釋</text><rect x="235" y="155" width="150" height="28" rx="7" fill="#246fbb"/><text x="395" y="176" font-size="17" fill="#284d43" text-anchor="start">約 10</text><text x="28" y="229" font-size="18" fill="#284d43" text-anchor="start">Terazosin</text><rect x="235" y="209" width="180" height="28" rx="7" fill="#246fbb"/><text x="425" y="230" font-size="17" fill="#284d43" text-anchor="start">約 12</text><text x="28" y="283" font-size="18" fill="#284d43" text-anchor="start">Doxazosin</text><rect x="235" y="263" width="330" height="28" rx="7" fill="#28735b"/><text x="575" y="284" font-size="17" fill="#284d43" text-anchor="start">約 22</text><text x="28" y="339" font-size="16" fill="#284d43" text-anchor="start">半衰期 ≠ 開始起效的時間，也不直接等於服藥間隔。</text><text x="28" y="368" font-size="15" fill="#284d43" text-anchor="start">數字依仿單與劑型；個別病人、研究條件可能不同。</text></g></svg>

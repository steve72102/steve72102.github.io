<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="title"><title id="title">糖苷的碳碳鍵與碳氧鍵連接方式</title><rect width="680" height="410" rx="18" fill="#fbfdf8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="28" y="36" font-size="24" fill="#284d43" text-anchor="start">C 與 O 說的是「糖怎麼接出去」</text><text x="28" y="72" font-size="18" fill="#284d43" text-anchor="start">O-糖苷：糖端的碳經由氧接到另一部分</text><text x="60" y="131" font-size="24" fill="#28735b" text-anchor="start">糖端 C</text><text x="300" y="131" font-size="28" fill="#246fbb" text-anchor="start">O</text><text x="470" y="131" font-size="24" fill="#284d43" text-anchor="start">苷元</text><path d="M164 122H280M330 122H448" stroke="#284d43" stroke-width="3"/><text x="28" y="201" font-size="18" fill="#284d43" text-anchor="start">C-糖苷：糖端的碳直接接到另一個碳</text><text x="60" y="260" font-size="24" fill="#28735b" text-anchor="start">糖端 C</text><text x="450" y="260" font-size="24" fill="#284d43" text-anchor="start">C（苷元）</text><path d="M164 251H427" stroke="#284d43" stroke-width="3"/><text x="28" y="316" font-size="16" fill="#284d43" text-anchor="start">C＝碳，O＝氧；糖端 C 指形成糖苷連接的異頭碳。</text><text x="28" y="348" font-size="16" fill="#284d43" text-anchor="start">「同時有 C 與 O 型」表示同一分子有兩種連接，並非 C=O 雙鍵。</text><text x="28" y="382" font-size="15" fill="#284d43" text-anchor="start">概念片段圖：省略其他原子與鍵，不代表完整分子結構。</text></g></svg>

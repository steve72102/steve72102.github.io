<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title"><title id="title">Statin 常見含氮環與羧酸官能基</title><rect width="680" height="470" rx="18" fill="#fbfdf8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="28" y="36" font-size="24" fill="#284d43" text-anchor="start">把「環型」與「酸基」分開辨認</text><text x="28" y="76" font-size="19" fill="#284d43" text-anchor="start">Atorvastatin：pyrrole 吡咯</text><path d="M135.00,110.00 L179.70,142.48" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M179.70,142.48 L162.63,195.02" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M172.10,144.95 L157.93,188.56" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M162.63,195.02 L107.37,195.02" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M107.37,195.02 L90.30,142.48" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M112.07,188.56 L97.90,144.95" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M90.30,142.48 L135.00,110.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="135.00" cy="110.00" r="12" fill="#fbfdf8"/><text x="135.0" y="117.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="28" y="231" font-size="16" fill="#284d43" text-anchor="start">五個頂點；其中 1 個是 N。</text><text x="355" y="76" font-size="18" fill="#284d43" text-anchor="start">Rosuvastatin：pyrimidine 嘧啶</text><path d="M500.00,112.00 L538.97,134.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M500.00,119.65 L532.35,138.32" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M538.97,134.50 L538.97,179.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M538.97,179.50 L500.00,202.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M532.35,175.67 L500.00,194.35" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M500.00,202.00 L461.03,179.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M461.03,179.50 L461.03,134.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M467.65,175.67 L467.65,138.32" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M461.03,134.50 L500.00,112.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="500.00" cy="112.00" r="12" fill="#fbfdf8"/><text x="500.0" y="119.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><circle cx="538.97" cy="179.50" r="12" fill="#fbfdf8"/><text x="538.9711431702997" y="186.5" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="355" y="231" font-size="16" fill="#284d43" text-anchor="start">六個頂點；其中 2 個是 N。</text><path d="M28 257H652" stroke="#d8e3d8"/><text x="28" y="291" font-size="20" fill="#284d43" text-anchor="start">羧酸基：—C(=O)—OH</text><text x="28" y="324" font-size="17" fill="#284d43" text-anchor="start">Atorvastatin 同時有吡咯環與帶羧酸的開鏈部分。</text><text x="28" y="354" font-size="16" fill="#284d43" text-anchor="start">「開鏈」表示這段沒有封成內酯環；成鹽時可寫作 —COO⁻。</text><text x="28" y="397" font-size="16" fill="#284d43" text-anchor="start">看到五角形還不夠：要確認 N 的位置與雙鍵。</text><text x="28" y="437" font-size="15" fill="#284d43" text-anchor="start">只畫本題要辨認的片段，省略氫與其他取代基。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img" aria-labelledby="title"><title id="title">辨認四種環型：藍色 N 是環上的氮原子</title><rect width="680" height="540" rx="18" fill="#fbfdf8"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="28" y="36" font-size="25" fill="#284d43" text-anchor="start">先看環形，再數藍色 N</text><text x="28" y="64" font-size="16" fill="#284d43" text-anchor="start">N＝氮原子；未標字母的轉角通常是碳。</text><path d="M28 85H652" stroke="#d8e3d8"/><path d="M28 295H652" stroke="#d8e3d8"/><text x="28" y="115" font-size="20" fill="#284d43" text-anchor="start">Quinazoline 喹唑啉</text><path d="M110.00,145.00 L144.64,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M144.64,165.00 L144.64,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M138.75,168.40 L138.75,201.60" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M144.64,205.00 L110.00,225.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M110.00,225.00 L75.36,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M110.00,218.20 L81.25,201.60" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M75.36,205.00 L75.36,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M75.36,165.00 L110.00,145.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M81.25,168.40 L110.00,151.80" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M179.28,145.00 L213.92,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M179.28,151.80 L208.03,168.40" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M213.92,165.00 L213.92,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M213.92,205.00 L179.28,225.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M208.03,201.60 L179.28,218.20" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M179.28,225.00 L144.64,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M144.64,165.00 L179.28,145.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="179.28" cy="145.00" r="12" fill="#fbfdf8"/><text x="179.28203230275508" y="152.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><circle cx="213.92" cy="205.00" r="12" fill="#fbfdf8"/><text x="213.92304845413264" y="212.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="28" y="255" font-size="16" fill="#284d43" text-anchor="start">兩環共用一邊；含氮的環上有 2 個 N。</text><text x="365" y="115" font-size="20" fill="#284d43" text-anchor="start">Quinoline 喹啉</text><path d="M440.00,145.00 L474.64,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M474.64,165.00 L474.64,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M468.75,168.40 L468.75,201.60" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M474.64,205.00 L440.00,225.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M440.00,225.00 L405.36,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M440.00,218.20 L411.25,201.60" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M405.36,205.00 L405.36,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M405.36,165.00 L440.00,145.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M411.25,168.40 L440.00,151.80" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M509.28,145.00 L543.92,165.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M509.28,151.80 L538.03,168.40" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M543.92,165.00 L543.92,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M543.92,205.00 L509.28,225.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M538.03,201.60 L509.28,218.20" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M509.28,225.00 L474.64,205.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M474.64,165.00 L509.28,145.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="509.28" cy="145.00" r="12" fill="#fbfdf8"/><text x="509.28203230275506" y="152.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="365" y="255" font-size="16" fill="#284d43" text-anchor="start">外形相近，但只有 1 個環內 N。</text><text x="28" y="325" font-size="20" fill="#284d43" text-anchor="start">Piperazine 哌嗪</text><path d="M145.00,352.00 L183.97,374.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M183.97,374.50 L183.97,419.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M183.97,419.50 L145.00,442.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M145.00,442.00 L106.03,419.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M106.03,419.50 L106.03,374.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M106.03,374.50 L145.00,352.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="145.00" cy="352.00" r="12" fill="#fbfdf8"/><text x="145.0" y="359.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><circle cx="145.00" cy="442.00" r="12" fill="#fbfdf8"/><text x="145.0" y="449.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="28" y="470" font-size="16" fill="#284d43" text-anchor="start">單一六元飽和環；兩個 N 位在對面。</text><text x="365" y="325" font-size="20" fill="#284d43" text-anchor="start">Piperidine 哌啶</text><path d="M500.00,352.00 L538.97,374.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M538.97,374.50 L538.97,419.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M538.97,419.50 L500.00,442.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M500.00,442.00 L461.03,419.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M461.03,419.50 L461.03,374.50" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><path d="M461.03,374.50 L500.00,352.00" fill="none" stroke="#284d43" stroke-width="2.5" stroke-linecap="round"/><circle cx="500.00" cy="352.00" r="12" fill="#fbfdf8"/><text x="500.0" y="359.0" font-size="23" fill="#246fbb" text-anchor="middle">N</text><text x="365" y="470" font-size="16" fill="#284d43" text-anchor="start">單一六元飽和環；只有 1 個 N。</text><text x="28" y="514" font-size="15" fill="#284d43" text-anchor="start">環型示意：省略氫與藥物其他取代基；不是完整藥物結構。</text></g></svg>
